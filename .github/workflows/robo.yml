YAML
name: Robô do Trânsito Barueri

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: 

jobs:
  vigiar-transito:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos
        uses: actions/checkout@v3

      - name: Preparar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar as ferramentas
        run: pip install -r requirements.txt

      - name: Executar a leitura do mapa
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
